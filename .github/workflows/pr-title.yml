# PRs are squash-merged with the title as the commit message, and release-please builds the
# changelog from those, so the title has to be a conventional commit.
name: PR title

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
